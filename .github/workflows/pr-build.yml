name: Build de comprobación

# Construye la web en cada pull request. No despliega nada: publicar sigue
# siendo cosa de deploy.yml, con un push a main.
#
# Por qué existe. Dependabot abre un pull request por cada actualización y los
# de npm llegaban sin comprobar: para saber si uno rompía algo había que bajar
# la rama y construirla a mano. En noviembre de 2026 se revisaron ocho así. Dos
# de ellos (zone.js 0.16 y jasmine-core 7) ni siquiera instalaban: `npm ci`
# fallaba por una dependencia incompatible, y eso solo se habría visto al
# fusionarlos, con el despliegue ya roto.
on:
  pull_request:
    branches: [main]
    # El agente y el corpus tienen su propio flujo (agent-ci.yml) y la
    # documentación no cambia lo que se publica.
    paths-ignore:
      - "agent/**"
      - "corpus/**"
      - "docs/**"

# Solo lectura. Este flujo instala y ejecuta lo que traiga el pull request,
# dependencias nuevas incluidas, así que no debe poder escribir en el
# repositorio ni publicar.
permissions:
  contents: read

# Un push nuevo al mismo pull request cancela el build anterior.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Mismas acciones y mismos SHA que deploy.yml. Dependabot las actualiza
      # en los dos archivos a la vez.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Aquí no se hace ningún push: el token no tiene que quedar guardado.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Si el pull request sube un paquete a una versión que otro no admite,
      # falla aquí con ERESOLVE y el mensaje dice cuáles son los dos.
      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

      # Las mismas comprobaciones que hace deploy.yml antes de publicar. Si
      # cambian allí (una ruta nueva, por ejemplo), tienen que cambiar aquí.
      - name: Verificar el build
        run: |
          count=$(find dist/datalent-web-page -name index.html | wc -l)
          echo "index.html encontrados: $count"
          find dist/datalent-web-page -name index.html | sort
          if [ "$count" -ne 12 ]; then
            echo "::error::Se esperaban 12 rutas prerenderizadas y hay $count."
            exit 1
          fi
          if ! grep -q 'name="robots" content="noindex' dist/datalent-web-page/404.html; then
            echo "::error::Falta 404.html o no lleva noindex."
            exit 1
          fi
          if [ ! -s dist/datalent-web-page/.well-known/security.txt ]; then
            echo "::error::Falta .well-known/security.txt en el build."
            exit 1
          fi
          if grep -q '<app-root></app-root>' dist/datalent-web-page/index.html; then
            echo "::error::index.html sigue siendo el cascarón sin prerenderizar."
            exit 1
          fi
