# Dependabot: propone actualizaciones como pull requests. No despliega nada:
# el deploy solo se lanza con un push a main, así que cada PR se revisa antes.
#
# Por qué existe. En julio de 2026 el sitio se dejó en Angular 20.3.26 con cero
# avisos. En noviembre tenía ocho avisos de producción, cuatro de severidad
# alta, y nadie lo sabía porque nada lo comprobaba. Ver docs/seguridad.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Los paquetes de Angular se publican juntos y se exigen la misma versión
      # exacta entre sí: actualizarlos de uno en uno no resuelve.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    ignore:
      # Un salto de versión mayor de Angular es una migración y se hace a mano.
      # La última, de la 20 a la 22, está en docs/release-notes-angular-22.md.
      # Angular 22 tiene soporte activo hasta junio de 2027 y LTS hasta junio
      # de 2028: la siguiente migración hay que hacerla antes de esa fecha.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # Desde la migración a Angular 22 no queda ningún paquete
      # @angular-devkit/* como dependencia directa (el builder pasó a
      # @angular/build). La regla se conserva por si vuelve a entrar alguno.
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Angular fija el rango de TypeScript que admite. Angular 22 solo
      # acepta la serie 6.0 (>=6.0 <6.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Lo mismo con zone.js: Angular 22 admite ~0.15.0 y ~0.16.0. En las
      # versiones 0.x cada salto de segunda cifra puede romper, y Dependabot
      # ya propuso la 0.16 cuando Angular 20 solo admitía la 0.15.
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
