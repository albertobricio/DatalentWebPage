  <link rel="canonical" href="https://datalentsolutions.com">
  <base href="/">
  
  <!--
    Iconos. Todos salen de src/assets/logo-simbolo.svg vía `npm run marca`.
    El SVG lo prefieren los navegadores modernos porque escala sin bordes
    dentados; el PNG de 32 y el .ico quedan como respaldo, y el .ico además
    porque muchos rastreadores piden /favicon.ico por convención.
    Antes: favicon.ico pesaba 0 bytes y el apple-touch-icon apuntaba al icono
    dorado de personas de la v1, que no tiene nada que ver con la marca.
  -->
  <link rel="icon" type="image/svg+xml" href="assets/logo-simbolo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  
  <!-- Preconnect to external resources for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://api.emailjs.com" crossorigin>

  <!-- Typography: Inter (UI/body) + Source Serif 4 (display headlines only) -->
  <!-- See projects/datalent-v2/typography-rules.md for the scoped-serif rationale. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">

  <!-- Lucide icons — see projects/datalent-v2/iconography.md -->
  <script src="https://unpkg.com/lucide@0.469.0"></script>

  <!-- JSON-LD Schema for SEO. A single Organization block, site-wide — this

        "addressCountry": "ES"
      },
      "contactPoint": {

        "email": "gmorales@datalentsolutions.com",
        "areaServed": "ES",
        "availableLanguage": ["Spanish", "English"]
      },

        "Agentic AI",
        "People Analytics",
        "Compensation & Benefits",
        "Total Rewards",
        "AI Governance",

      ]
    }
