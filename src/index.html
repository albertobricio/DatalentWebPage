<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Charset and Viewport -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <!-- Security Headers -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!--
    Content Security Policy.

    Cambios respecto a la anterior:
      · script-src: fuera https://unpkg.com. Se cargaba lucide (358 kB de
        JavaScript ejecutable de terceros, sin comprobación de integridad)
        para un componente de iconos que no se usaba en ninguna página.
      · style-src / font-src: fuera los dominios de Google. Las fuentes ahora
        se sirven desde el propio dominio.
      · img-src: 'https:' permitía cualquier imagen de cualquier origen. El
        sitio no carga ninguna imagen externa, así que se acota.
      · frame-ancestors: eliminado. El navegador lo IGNORA cuando la CSP llega
        por <meta>; solo funciona como cabecera HTTP. Dejarlo daba una falsa
        sensación de protección contra clickjacking. GitHub Pages no permite
        definir cabeceras, así que esa protección hoy no existe: ver
        docs/seguridad.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.emailjs.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <!-- SEO & Meta Tags -->
  <title>IA para recursos humanos, gobernada en Europa | Datalent</title>
  <meta name="description" content="Agentes de IA para selección, trámites laborales y seguimiento de plantilla, con supervisión humana. RGPD y Reglamento Europeo de IA. Diagnóstico gratuito.">
  <meta name="keywords" content="IA para recursos humanos, inteligencia artificial RRHH, agentes de IA RRHH, gobernanza de IA RRHH, Reglamento Europeo de IA recursos humanos, people analytics España">
  <meta name="author" content="Datalent Solutions">
  <meta name="language" content="es">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <!--
    PENDIENTE: pegar aquí el token de Google Search Console y añadir el de Bing.
    Vacío no verifica nada, y sin verificar la propiedad no se puede pedir
    reindexación ni enviar el sitemap. Es lo que hoy bloquea que los buscadores
    dejen de mostrar el título y la descripción de la web anterior.
      <meta name="google-site-verification" content="TOKEN">
      <meta name="msvalidate.01" content="TOKEN">
  -->

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://datalentsolutions.com/">
  <meta property="og:title" content="IA para recursos humanos, gobernada en Europa | Datalent">
  <meta property="og:description" content="Agentes de IA para RR. HH. con límites de autonomía documentados, un punto de control humano y gobernanza de datos europea.">
  <meta property="og:image" content="https://datalentsolutions.com/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Datalent Solutions. Agentic AI para RR. HH., diseñada y gobernada en Europa.">
  <meta property="og:locale" content="es_ES">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="IA para recursos humanos, gobernada en Europa | Datalent">
  <meta name="twitter:description" content="Agentes de IA para RR. HH. con límites de autonomía documentados y gobernanza de datos europea.">
  <meta name="twitter:image" content="https://datalentsolutions.com/assets/og-image.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://datalentsolutions.com/">
  <base href="/">
  
  <!--
    Iconos. Todos salen de src/assets/logo-simbolo.svg vía `npm run marca`.
    El SVG lo prefieren los navegadores modernos porque escala sin bordes
    dentados; el PNG de 32 y el .ico quedan como respaldo, y el .ico además
    porque muchos rastreadores piden /favicon.ico por convención.
    Antes: favicon.ico pesaba 0 bytes y el apple-touch-icon apuntaba al icono
    dorado de personas de la v1, que no tiene nada que ver con la marca.
  -->
  <link rel="icon" type="image/svg+xml" href="assets/logo-simbolo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  
  <!--
    Antes había aquí un preconnect a api.emailjs.com. Abría una conexión con
    un tercero en TODAS las páginas y para todos los visitantes, aunque solo
    se usa al enviar el formulario de /contacto: gastaba una conexión y
    desmentía el "cero peticiones a terceros al cargar" de docs/seguridad.md.

    En su lugar se precargan las dos fuentes que pintan lo primero que se ve
    (el titular en Source Serif y el texto en Inter). Sin esto el navegador no
    sabe que las necesita hasta haber descargado y procesado el CSS, y el
    titular se pinta primero con la fuente de reserva y luego salta. Los
    nombres deben coincidir con src/styles/theme/_fonts.scss.
  -->
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/source-serif-4-700-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Typography: Inter (UI/body) + Source Serif 4 (display headlines only) -->
  <!-- See projects/datalent-v2/typography-rules.md for the scoped-serif rationale. -->

  <!-- Lucide icons — see projects/datalent-v2/iconography.md -->

  <!-- JSON-LD Schema for SEO. A single Organization block, site-wide — this
       used to be two duplicate/conflicting blocks (docs/website-audit.md),
       one of them still describing the pre-v2 positioning. -->
  <!--
    Organization + ProfessionalService (subtipo de LocalBusiness): la auditoría
    de YAG (oct. 2026) pedía señal de negocio local para Tarancón/Cuenca. Las
    páginas de servicio enlazan a este bloque por @id en vez de redefinirlo.
  -->
  <!--
    WebSite, además de Organization. Es la señal documentada que usa Google para
    decidir qué nombre de sitio muestra en los resultados; con solo Organization
    puede acabar inventándoselo a partir del <title> o del dominio.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Datalent Solutions",
    "alternateName": "Datalent",
    "url": "https://datalentsolutions.com",
    "inLanguage": "es-ES",
    "publisher": { "@id": "https://datalentsolutions.com/#organization" }
  }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "ProfessionalService"],
      "@id": "https://datalentsolutions.com/#organization",
      "name": "Datalent Solutions",
      "url": "https://datalentsolutions.com",
      "logo": "https://datalentsolutions.com/assets/favicon-180.png",
      "description": "Boutique agentic AI y people-analytics partner que diseña, despliega y gobierna agentes de IA para RR. HH. con límites de autonomía explícitos y gobernanza europea.",
      "sameAs": [
        "https://linkedin.com/company/datalent-solutions"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tarancón",
        "addressRegion": "Cuenca",
        "addressCountry": "ES"
      },
      "areaServed": { "@type": "Country", "name": "España" },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "gmorales@datalentsolutions.com",
        "areaServed": "ES",
        "availableLanguage": ["Spanish", "English"]
      },
      "knowsAbout": [
        "Agentic AI",
        "People Analytics",
        "Compensation & Benefits",
        "Total Rewards",
        "AI Governance",
        "Workforce Intelligence"
      ]
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
