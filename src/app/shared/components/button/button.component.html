<ng-template #label>
  <ng-content />
</ng-template>

@if (routerLink()) {
  <a
    class="btn btn--{{ variant() }}"
    [routerLink]="routerLink()"
    [queryParams]="queryParams() ?? null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-disabled]="disabled() ? true : null"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </a>
} @else if (href()) {
  <a
    class="btn btn--{{ variant() }}"
    [href]="href()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-disabled]="disabled() ? true : null"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </a>
} @else {
  <button
    class="btn btn--{{ variant() }}"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() ?? null"
  >
    <ng-container [ngTemplateOutlet]="label" />
  </button>
}
