<!--
  The block sits directly after each page's <h1> and its pillar names are
  <h3>, which skipped a heading level (h1 -> h3) on both Home and Por qué
  Datalent — a WCAG 1.3.1 failure that had been live since Sprint 2. The
  section has no visible heading in the approved design, so the fix is a
  visually-hidden <h2> rather than a design change.
-->
<h2 class="visually-hidden">Nuestros pilares</h2>
<ul class="pillar-block">
  @for (pillar of pillars; track pillar.marker) {
    <li class="pillar-block__item">
      <span class="pillar-block__marker" aria-hidden="true">{{ pillar.marker }}</span>
      <h3 class="pillar-block__name">{{ pillar.name }}</h3>
      <p class="pillar-block__statement">{{ pillar.statement }}</p>
    </li>
  }
</ul>
