<section class="not-found">
  <div class="container">
    <p class="not-found__code">Error 404</p>
    <h1>Esta página no existe</h1>
    <p class="not-found__lead">
      Puede que el enlace esté mal escrito o que la página haya cambiado de dirección.
      Desde aquí llegas a todo lo demás.
    </p>

    <ul class="not-found__list">
      @for (salida of salidas; track salida.path) {
        <li>
          <a class="not-found__link" [routerLink]="salida.path">
            <span class="not-found__link-label">
              {{ salida.label }} <span aria-hidden="true">→</span>
            </span>
            <span class="not-found__link-detail">{{ salida.detalle }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="not-found__actions">
      <a class="text-link" routerLink="/">Volver al inicio</a>
      <app-cta variant="diagnostico" />
    </div>
  </div>
</section>
