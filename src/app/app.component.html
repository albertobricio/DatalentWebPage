<app-main-topbar></app-main-topbar>
<router-outlet></router-outlet>
<app-footer></app-footer>

<!-- Banner de Cookies -->
<div 
  *ngIf="showCookieBanner"
  class="fixed bottom-0 left-0 right-0 bg-dark-base text-white p-5 z-50 shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-accent-cyan/20"
>
  <span class="text-sm text-gray-300 text-center sm:text-left">
    Usamos cookies para mejorar tu experiencia y analizar el uso del sitio.
    Puedes aceptar o rechazar su uso. Consulta nuestra
    <a href="assets/cookie-policy.pdf" target="_blank" class="text-accent-cyan underline hover:text-accent-cyan/80">
      política de cookies
    </a>.
  </span>

  <div class="flex flex-col sm:flex-row gap-3">
    <button 
      (click)="acceptCookies()" 
      class="px-4 py-2 bg-accent-cyan text-dark-base rounded-lg font-semibold text-sm hover:bg-accent-cyan/80 transition"
    >
      Aceptar
    </button>
    <button 
      (click)="rejectCookies()" 
      class="px-4 py-2 border border-accent-cyan text-accent-cyan rounded-lg font-semibold text-sm hover:bg-accent-cyan/10 transition"
    >
      Rechazar
    </button>
  </div>
</div>
