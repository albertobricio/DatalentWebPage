<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<app-header />

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-footer />

<!--
  Aura va después del footer en el orden del documento, así que el lector de
  pantalla y el tabulador la encuentran al final, cuando ya han recorrido la
  página. Un asistente que se cuela antes del contenido estorba.

  Y no aparece mientras el aviso de cookies siga sin resolver. Los dos son
  elementos fijos en la esquina inferior, así que el panel de Aura quedaba
  tapado por el banner; pero además superponer un asistente comercial a una
  puerta de consentimiento es exactamente lo que no debe hacer una firma que
  vende gobernanza. Primero el consentimiento, luego todo lo demás.
-->
@if (!showCookieBanner()) {
  <app-aura />
}

@if (showCookieBanner()) {
  <div class="cookie-banner" role="region" aria-label="Aviso de cookies">
    <p class="cookie-banner__text">
      Usamos cookies para mejorar tu experiencia y analizar el uso del sitio. Puedes
      aceptar o rechazar su uso. Consulta nuestra
      <a href="assets/cookie-policy.pdf" target="_blank" rel="noopener noreferrer"
        >política de cookies</a
      >.
    </p>
    <div class="cookie-banner__actions">
      <app-button variant="secondary" (click)="rejectCookies()">Rechazar</app-button>
      <app-button variant="primary" (click)="acceptCookies()">Aceptar</app-button>
    </div>
  </div>
}
