# ---------------------------------------------------------------------------
# CONFLICTS FOUND IN docs/framework-audit.md — RESOLVED HERE
# (requirements 7 and 8: eliminate duplicated/contradictory logic, single source of truth)
# ---------------------------------------------------------------------------
resolved_conflicts:
  - id: ai-quality-scorer-conflict
    source: "docs/framework-audit.md §7.1"
    conflicting_files:
      - .claude/intelligence/evaluation-engine.md
      - .claude/execution/testing-engine.md
    resolution: >
      ai-governance-auditor is the authoritative final scorer for both Governance and
      AI Quality, always — matching evaluation-engine.md's "Who Scores" section.
      testing-engine.md's Domain-Accuracy Testing may still run a first-pass self-check
      by the owning specialist (e.g. agentic-ai-architect), but that self-score is
      provisional only; it does not satisfy the AI Quality dimension until
      ai-governance-auditor confirms it — the same two-pass pattern evaluation-engine.md
      already applies to Evidence scoring.
    status: resolved-in-registry
    note: "Source files retain their original text; this registry entry governs actual behavior until those files are next revised."

  - id: six-gate-equivalence-claim
    source: "docs/framework-audit.md §7.2"
    conflicting_files:
      - .claude/execution/testing-engine.md
    resolution: >
      testing-engine.md's five test types plus composite scoring are NOT identical to
      quality-gates.md's six gates. Canonical mapping: Non-Fabrication Testing = Gate 1;
      Domain-Accuracy Testing = Gate 2; Governance/Compliance Testing = Gate 3;
      Persona-Panel Adversarial Testing = Gate 4; composite scoring step = Gate 5.
      Regression Testing has no Gate counterpart (it is a genuine addition, unique to
      running multi-task projects over time). Gate 6 (Human-Readiness Check) has no
      named Testing-phase counterpart and must still run — it is folded into the
      Testing phase's final pass per this registry, not dropped.
    status: resolved-in-registry

  - id: testing-engine-internal-ordering
    source: "docs/framework-audit.md §7.3"
    conflicting_files:
      - .claude/execution/testing-engine.md
    resolution: >
      Canonical execution order is the "Full Battery Sequencing" diagram's order:
      Non-Fabrication, Domain-Accuracy, Governance/Compliance, Regression,
      Persona-Panel, then Composite Scoring (folding in the Gate 6 Human-Readiness
      check per the resolution above). The file's numbered section headers
      (1 Non-Fabrication, 2 Persona-Panel, 3 Governance, 4 Domain-Accuracy,
      5 Regression) reflect documentation order only, not execution order.
    status: resolved-in-registry

