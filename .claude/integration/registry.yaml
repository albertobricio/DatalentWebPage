# ---------------------------------------------------------------------------
# COMMANDS  (requirement 2: every command declares which agents it invokes)
# ---------------------------------------------------------------------------
commands:
  - id: agent-design
    path: .claude/commands/agent-design.md
    invokes: { primary: agentic-ai-architect, mandatory: [ai-governance-auditor] }
    uses_templates: [agent-spec-template]
    maps_to_workflow: agentic-ai-design
    quality_gates: [1, 2, 3, 5, 6]

  - id: ai-risk-classify
    path: .claude/commands/ai-risk-classify.md
    invokes: { primary: ai-governance-auditor, optional: [agentic-ai-architect] }
    uses_templates: [ai-governance-brief-template]
    maps_to_workflow: ai-risk-classification
    quality_gates: [1, 3, 5, 6]

  - id: case-study
    path: .claude/commands/case-study.md
    invokes: { primary: client-content-writer, dynamic: [owning-specialist], mandatory: [competitive-positioning-analyst] }
    uses_templates: [case-study-template]
    maps_to_workflow: case-study
    quality_gates: [1, 2, 4, 5, 6]
    conditional_gates: { "3": "if engagement described an AI system" }

  - id: comp-benchmark
    path: .claude/commands/comp-benchmark.md
    invokes: { primary: compensation-benefits-specialist, downstream_consumer: total-rewards-strategist }
    uses_templates: []
    maps_to_workflow: compensation-benchmark
    quality_gates: [1, 2, 5, 6]

  - id: faq-entry
    path: .claude/commands/faq-entry.md
    invokes: { primary: client-content-writer, conditional: [ai-governance-auditor] }
    uses_templates: [faq-entry-template]
    maps_to_workflow: faq-entry
    quality_gates: [1, 2, 4, 5, 6]
    conditional_gates: { "3": "if entry addresses AI/data/governance topics" }

  - id: newsletter-issue
    path: .claude/commands/newsletter-issue.md
    invokes: { primary: client-content-writer, mandatory: [competitive-positioning-analyst] }
    uses_templates: [newsletter-issue-template]
    maps_to_workflow: newsletter-issue
    quality_gates: [1, 4, 5, 6]
    conditional_gates: { "2": "per domain of featured case", "3": "if featured case is agentic-AI-related" }

  - id: pay-equity-audit
    path: .claude/commands/pay-equity-audit.md
    invokes: { primary: compensation-benefits-specialist, conditional: [ai-governance-auditor] }
    uses_templates: [pay-equity-audit-report-template]
    maps_to_workflow: pay-equity-audit
    quality_gates: [1, 2, 5, 6]
    conditional_gates: { "3": "if automated pay-setting tool involved", "4": "if client-facing report" }

  - id: positioning-check
    path: .claude/commands/positioning-check.md
    invokes: { primary: competitive-positioning-analyst, handoff: client-content-writer }
    uses_templates: [competitive-battlecard-template]
    maps_to_workflow: positioning-check
    quality_gates: [1, 4, 5, 6]
    note: "Gate 4 IS this workflow's core function, not an external check on it"

  - id: proposal
    path: .claude/commands/proposal.md
    invokes: { primary: client-content-writer, dynamic: [service-line-specialists], conditional: [ai-governance-auditor], mandatory: [competitive-positioning-analyst] }
    uses_templates: [client-proposal-template]
    maps_to_workflow: client-proposal
    quality_gates: [1, 2, 4, 5, 6]
    conditional_gates: { "3": "if AI/agentic work is proposed" }

  - id: workforce-forecast
    path: .claude/commands/workforce-forecast.md
    invokes: { primary: workforce-intelligence-strategist, input_from: [people-analytics-analyst] }
    uses_templates: []
    maps_to_workflow: workforce-forecast
    quality_gates: [1, 2, 5, 6]

