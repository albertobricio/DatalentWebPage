  - id: total-rewards-strategist
    path: .claude/agents/total-rewards-strategist.md
    primary_tags: [total-rewards-synthesis]
    secondary_tags: [comp-benchmark, attrition-analysis]
    loads:
      memory: [service-lines, non-fabrication-policy]
      knowledge: [compensation-total-rewards, hr-strategy, people-analytics]
      intelligence: [capability-matrix, coordination-protocol, quality-gates, reasoning-patterns]
    invoked_by: { commands: [], note: "no dedicated command — see docs/framework-audit.md §6, routing.md dynamic-selection fallback" }
    reviewed_by: compensation-benefits-specialist

  - id: workforce-intelligence-strategist
    path: .claude/agents/workforce-intelligence-strategist.md
    primary_tags: [workforce-scenario, labor-market-signal]
    secondary_tags: [attrition-analysis, hr-operating-model]
    loads:
      memory: [non-fabrication-policy]
      knowledge: [workforce-intelligence, people-analytics, hr-strategy]
