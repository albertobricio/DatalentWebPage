# Datalent Solutions AI Operating System — Master Registry
#
# This file is the authoritative dependency declaration for every file in .claude/.
# It exists because docs/framework-audit.md found that three of four layers
# (knowledge/, intelligence/, execution/ — 76% of the system's word count) had
# zero inbound references from the two layers Claude Code actually invokes
# (agents/, commands/). Rather than retrofitting cross-references into 39
# existing files — a large, error-prone edit with no mechanical guarantee of
# staying consistent — this registry centralizes every declaration in one place.
#
# RULE: where this file's declarations disagree with a source file's own prose,
# THIS FILE GOVERNS. See versioning.md and validation-map.md for how that's
# enforced and kept current.

schema_version: "1.0"
registry_version: "1.0.0"
last_updated: "2026-07-02"
source_of_truth: true
total_files_registered: 65

# ---------------------------------------------------------------------------
# CONSTITUTION
# ---------------------------------------------------------------------------
constitution:
  - id: claude-md
    path: .claude/CLAUDE.md
    type: constitution
    declares_layers: [agents, commands, memory, templates]
    known_gap: "Folder map predates knowledge/, intelligence/, execution/, integration/ — see docs/framework-audit.md §1.1. This registry is the current source of truth on folder structure until CLAUDE.md is next revised."
    consumed_by: { all: true }

# ---------------------------------------------------------------------------
# AGENTS  (requirement 1: every agent declares which files it loads)
# ---------------------------------------------------------------------------
agents:
  - id: agentic-ai-architect
    path: .claude/agents/agentic-ai-architect.md
    primary_tags: [agentic-design]
    secondary_tags: [governance-classification]
    loads:
      memory: [positioning-decisions, compliance-glossary]
      knowledge: [agentic-ai, ai-governance, eu-ai-act]
      intelligence: [capability-matrix, coordination-protocol, quality-gates, reasoning-patterns]
      templates: [agent-spec-template]
    invoked_by: { commands: [agent-design] }
    reviewed_by: ai-governance-auditor

  - id: ai-governance-auditor
    path: .claude/agents/ai-governance-auditor.md
    primary_tags: [governance-classification, bias-audit]
    secondary_tags: [agentic-design]
    loads:
      memory: [compliance-glossary, non-fabrication-policy]
      knowledge: [ai-governance, eu-ai-act, agentic-ai]
      intelligence: [capability-matrix, coordination-protocol, quality-gates, reasoning-patterns, conflict-resolution, evaluation-engine]
      templates: [ai-governance-brief-template]
    invoked_by: { commands: [ai-risk-classify], conditional_on_tags: [agentic-design, bias-audit, governance-classification] }
    reviewed_by: agentic-ai-architect
    authority: "Veto power over agentic-design and governance-classification outputs — see conflict-resolution.md"

  - id: people-analytics-analyst
    path: .claude/agents/people-analytics-analyst.md
    primary_tags: [attrition-analysis, culture-diagnostic]
    secondary_tags: [bias-audit, hr-operating-model]
    loads:
      memory: [service-lines, non-fabrication-policy]
      knowledge: [people-analytics, hr-strategy, ai-governance]
      intelligence: [capability-matrix, coordination-protocol, quality-gates, reasoning-patterns]
    invoked_by: { commands: [], note: "no dedicated command — see docs/framework-audit.md §6, routing.md dynamic-selection fallback" }
    reviewed_by: workforce-intelligence-strategist

  - id: compensation-benefits-specialist
    path: .claude/agents/compensation-benefits-specialist.md
    primary_tags: [comp-benchmark, pay-equity]
    secondary_tags: [governance-classification]
    loads:
      memory: [compliance-glossary, non-fabrication-policy]
      knowledge: [compensation-total-rewards, eu-ai-act]
      intelligence: [capability-matrix, coordination-protocol, quality-gates, reasoning-patterns]
